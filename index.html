<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anastasiia Kononenko - SteelOrbis</title>
    
    <link rel="icon" type="image/png" href="logo.png?v=2">
    <link rel="apple-touch-icon" href="logo.png?v=2">
    <link rel="manifest" href="site.webmanifest?v=2">
    <meta name="theme-color" content="#003366">

    <meta property="og:title" content="Anastasiia Kononenko — SteelOrbis" />
    <meta property="og:description" content="Market Intelligence Head Division · Southeast Asia / China / CIS" />
    <meta property="og:image" content="https://newagno.github.io/akononenko/logo.png?v=2" />
    <meta property="og:url" content="https://newagno.github.io/akononenko/" />
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="SteelOrbis" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Anastasiia Kononenko — SteelOrbis" />
    <meta name="twitter:description" content="Market Intelligence Head Division · Southeast Asia / China / CIS" />
    <meta name="twitter:image" content="https://newagno.github.io/akononenko/logo.png?v=2" />

    <style>
        :root {
            --so-blue: #003366;
            --so-red: #ea5c00;
            --text-light: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }

        body {
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at top, var(--so-blue), #001021);
            color: var(--text-light);
            padding: 20px;
        }

        .card {
            width: 100%; max-width: 360px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 30px 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--so-red);
        }

        .lang-switcher {
            display: flex; justify-content: flex-end;
            margin-bottom: 16px;
        }
        .lang-select {
            padding: 6px 30px 6px 12px;
            font-size: 12px; font-weight: 600;
            color: var(--text-light);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            cursor: pointer; outline: none; box-shadow: none;
            transition: all 0.2s;
            appearance: none; -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3E%3Cpath d='M7 10l5 5 5-5H7z'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 8px center;
            background-size: 16px;
        }
        .lang-select:hover, .lang-select:focus {
            background-color: rgba(255, 255, 255, 0.15);
            border-color: var(--so-red);
            outline: none; box-shadow: none;
        }
        .lang-select option {
            background-color: #001021;
            color: var(--text-light);
        }

        .avatar {
            width: 100px; height: 100px; border-radius: 50%;
            margin: 0 auto 20px; background: white;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid var(--so-red); overflow: hidden;
            padding: 8px; box-shadow: 0 0 15px rgba(204, 0, 0, 0.3);
        }

        h1 { margin: 0; font-size: 24px; letter-spacing: -0.5px; }

        .role {
            font-size: 13px; color: var(--so-red); font-weight: 700;
            margin: 8px 0 25px 0; line-height: 1.4; text-transform: uppercase;
        }

        .quick-links {
            display: grid; grid-template-columns: 1fr 1fr 1fr;
            border-top: 1px solid rgba(255,255,255,0.1);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin: 0 -24px 25px;
        }

        .quick-btn {
            display: flex; flex-direction: column; align-items: center;
            padding: 15px 5px; text-decoration: none; color: white;
            font-size: 10px; font-weight: bold; text-transform: uppercase;
            transition: background 0.3s, transform 0.1s;
        }
        .quick-btn:not(:last-child) { border-right: 1px solid rgba(255,255,255,0.1); }
        .quick-btn:hover { background: rgba(255, 255, 255, 0.1); }
        .quick-btn:active { transform: scale(0.95); }
        .quick-btn .icon { margin-bottom: 5px; color: var(--so-red); }

        .contact-item {
            display: flex; align-items: center; gap: 15px;
            margin-bottom: 15px; text-decoration: none; color: inherit;
            padding: 12px; border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease, transform 0.1s;
            text-align: left;
        }
        .contact-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(5px);
            border-color: var(--so-red);
        }
        .contact-item:active { transform: scale(0.98) translateX(5px); }

        .info-block { display: flex; flex-direction: column; }
        .value { font-size: 14px; font-weight: 600; }
        .label { font-size: 11px; opacity: 0.6; margin-top: 2px; text-transform: uppercase; }

        .icon { width: 20px; height: 20px; color: var(--so-red); flex-shrink: 0; }
        .icon svg { width: 100%; height: 100%; fill: currentColor; }

        .btn-save, .btn-share {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            margin-top: 10px; padding: 12px 15px; border-radius: 12px;
            font-weight: bold; font-size: 14px; width: 100%;
            transition: transform 0.1s, background 0.3s, border-color 0.3s;
            cursor: pointer; position: relative; overflow: hidden;
        }
        
        .btn-save {
            background: var(--so-red); color: white; border: none;
            box-shadow: 0 10px 20px rgba(204, 0, 0, 0.3);
        }
        
        .btn-share {
            background: transparent; color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .btn-share:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--so-red); }
        .btn-save:active, .btn-share:active { transform: scale(0.97); }

        .btn-save .ripple, .btn-share .ripple {
            position: absolute; border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transform: scale(0);
            animation: ripple-anim 0.5s linear;
            pointer-events: none;
        }
        @keyframes ripple-anim { to { transform: scale(4); opacity: 0; } }

        .btn-save.saved, .btn-share.copied { background: #2e7d32; border-color: #2e7d32; box-shadow: 0 10px 20px rgba(46,125,50,0.3); }
        .btn-text { transition: opacity 0.2s; display: flex; align-items: center; gap: 10px; justify-content: center; pointer-events: none; }
        .btn-check { display: none; align-items: center; gap: 10px; justify-content: center; pointer-events: none; }
        .btn-save.saved .btn-text, .btn-share.copied .btn-text { display: none; }
        .btn-save.saved .btn-check, .btn-share.copied .btn-check { display: flex; }

        [dir="rtl"] .contact-item:hover { transform: translateX(-5px); }
        [dir="rtl"] .contact-item:active { transform: scale(0.98) translateX(-5px); }
        [dir="rtl"] .lang-switcher { justify-content: flex-start; }
        [dir="rtl"] .lang-select {
            padding: 6px 12px 6px 30px;
            background-position: left 8px center;
        }
    </style>

        <symbol id="icon-person-add" viewBox="0 0 24 24"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></symbol>

<body>

    <div class="card">
        <div class="lang-switcher">
            <select class="lang-select" id="lang-select" aria-label="Select Language">
                <option value="en">English (EN)</option>
                <option value="tr">Türkçe (TR)</option>
                <option value="zh">中文 (ZH)</option>
                <option value="ar">العربية (AR)</option>
            </select>
        </div>

        <a href="https://www.steelorbis.com" target="_blank" style="text-decoration: none;">
            <div class="avatar">
                <picture>
                    <source srcset="logo.webp?v=2" type="image/webp">
                    <img src="logo.png?v=2" alt="SteelOrbis" style="width: 95%; height: auto" fetchpriority="high" decoding="sync" />
                </picture>
            </div>
        </a>

        <h1 id="display-name"></h1>
        <div class="role" id="display-role"></div>

        <div class="quick-links">
            <a id="quick-call" href="#" class="quick-btn">
                <div class="icon"><svg><use href="#icon-phone"/></svg></div>
                <span data-i18n="call">Call</span>
            </a>
            <a id="quick-email-link" href="#" class="quick-btn e-trigger">
                <div class="icon"><svg><use href="#icon-email"/></svg></div>
                <span data-i18n="email">Email</span>
            </a>
            <a id="quick-wa" href="#" target="_blank" class="quick-btn">
                <div class="icon"><svg><use href="#icon-whatsapp"/></svg></div>
                <span data-i18n="whatsapp">WhatsApp</span>
            </a>
        </div>

        <div class="links">
            <a id="link-phone" href="#" class="contact-item">
                <div class="icon"><svg><use href="#icon-phone"/></svg></div>
                <div class="info-block">
                    <span class="value" id="text-phone"></span>
                    <span class="label" data-i18n="mobile">Mobile</span>
                </div>
            </a>

            <a id="email-link" href="#" class="contact-item e-trigger">
                <div class="icon"><svg><use href="#icon-email"/></svg></div>
                <div class="info-block">
                    <span class="value e-display">Contact</span>
                    <span class="label" data-i18n="emailLabel">Email</span>
                </div>
            </a>

            <a id="link-web" href="#" target="_blank" class="contact-item">
                <div class="icon"><svg><use href="#icon-globe"/></svg></div>
                <div class="info-block">
                    <span class="value" id="text-web"></span>
                    <span class="label" data-i18n="website">Website</span>
                </div>
            </a>

            <button id="save-contact" class="btn-save">
                <span class="btn-text">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="white" style="flex-shrink:0"><use href="#icon-person-add"/></svg>
                    <span data-i18n="addContact">Add to Contacts</span>
                </span>
                <span class="btn-check">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="white" style="flex-shrink:0"><use href="#icon-check"/></svg>
                    <span data-i18n="saved">Saved!</span>
                </span>
            </button>

            <button id="share-btn" class="btn-share">
                <span class="btn-text">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="white" style="flex-shrink:0"><use href="#icon-share"/></svg>
                    <span data-i18n="share">Share Profile</span>
                </span>
                <span class="btn-check">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="white" style="flex-shrink:0"><use href="#icon-check"/></svg>
                    <span data-i18n="copied">Link Copied!</span>
                </span>
            </button>
        </div>
    </div>

    <script data-cfasync="false">
        // ==========================================
        // ЦЕНТРАЛЬНА КОНФІГУРАЦІЯ ДАНИХ ВІЗИТІВКИ
        // ==========================================
        const CONFIG = {
            // Загальні дані для vCard та лінків
            firstName: "Anastasiia",
            lastName: "Kononenko",
            phoneRaw: "+905308346890",        // Без пробілів для tel: та wa.me
            phoneDisplay: "+90 530 834 68 90", // Форматоване відображення в інтерфейсі
            company: "SteelOrbis",
            websiteUrl: "https://www.steelorbis.com",
            websiteDisplay: "steelorbis.com",
            
            // Електронна пошта 'akononenko@steelorbis.com' розбита на фрагменти для захисту (JIT)
            emailUser: ['a','k','o','n','o','n','e','n','k','o'],
            emailDomain: ['s','t','e','e','l','o','r','b','i','s'],

            // Багатомовні блоки (Посади)
            languages: {
                en: {
                    role: "Market Intelligence Head Division<br>Southeast Asia / China / CIS"
                },
                tr: {
                    role: "Pazar İstihbarat Başkanı<br>Güneydoğu Asya / Çin / BDT"
                },
                zh: {
                    role: "市场情报部门负责人<br>东南亚 / 中国 / 独联体"
                },
                ar: {
                    role: "رئيس قسم استخبارات السوق<br>جنوب شرق آسيا / الصين / رابطة الدول المستقلة"
                }
            }
        };

        // Ініціалізація статичних даних із CONFIG в DOM
        document.getElementById('display-name').textContent = CONFIG.firstName + " " + CONFIG.lastName;
        document.getElementById('text-phone').textContent = CONFIG.phoneDisplay;
        document.getElementById('text-web').textContent = CONFIG.websiteDisplay;
        
        document.getElementById('quick-call').setAttribute('href', 'tel:' + CONFIG.phoneRaw);
        document.getElementById('link-phone').setAttribute('href', 'tel:' + CONFIG.phoneRaw);
        document.getElementById('quick-wa').setAttribute('href', 'https://wa.me/' + CONFIG.phoneRaw.replace('+', ''));
        document.getElementById('link-web').setAttribute('href', CONFIG.websiteUrl);

        // JIT Email Protection Assembly
        const eStr = CONFIG.emailUser.join('') + String.fromCharCode(64) + CONFIG.emailDomain.join('') + String.fromCharCode(46) + 'com';
        document.querySelector('.e-display').textContent = eStr;
        
        document.querySelectorAll('.e-trigger').forEach(function(el) {
            ['pointerover', 'touchstart'].forEach(function(ev) {
                el.addEventListener(ev, function() {
                    if (this.getAttribute('href') === '#') {
                        this.setAttribute('href', 'm' + 'a' + 'i' + 'l' + 't' + 'o' + ':' + eStr);
                    }
                }, { once: true });
            });
        });

        // Translations Dictionary
        var translations = {
            en: {
                call: "Call", email: "Email", whatsapp: "WhatsApp",
                mobile: "Mobile", emailLabel: "Email", website: "Website",
                addContact: "Add to Contacts", saved: "Saved!", 
                share: "Share Profile", copied: "Link Copied!", dir: "ltr"
            },
            tr: {
                call: "Ara", email: "E-posta", whatsapp: "WhatsApp",
                mobile: "Mobil", emailLabel: "E-posta", website: "Web Sitesi",
                addContact: "Kişilere Ekle", saved: "Kaydedildi!", 
                share: "Profili Paylaş", copied: "Bağlantı Kopyalandı!", dir: "ltr"
            },
            zh: {
                call: "致电", email: "邮件", whatsapp: "WhatsApp",
                mobile: "手机", emailLabel: "邮箱", website: "网站",
                addContact: "添加联系人", saved: "已保存！", 
                share: "分享个人资料", copied: "链接已复制！", dir: "ltr"
            },
            ar: {
                call: "اتصال", email: "بريد", whatsapp: "واتساب",
                mobile: "جوال", emailLabel: "البريد الإلكتروني", website: "الموقع",
                addContact: "إضافة للجهات", saved: "تم الحفظ!", 
                share: "مشاركة الملف الشخصي", copied: "تم نسخ الرابط!", dir: "rtl"
            }
        };

        function setLanguage(lang) {
            var t = translations[lang];
            var langConfig = CONFIG.languages[lang];
            
            document.documentElement.lang = lang;
            document.body.dir = t.dir;
            
            // Оновлення статичних перекладів UI
            document.querySelectorAll('[data-i18n]').forEach(function(el) {
                var key = el.getAttribute('data-i18n');
                if (t[key] !== undefined) el.innerHTML = t[key];
                if (langConfig[key] !== undefined) el.innerHTML = langConfig[key];
            });

            // Оновлення динамічних блоків із CONFIG
            document.getElementById('display-role').innerHTML = langConfig.role;

            var select = document.getElementById('lang-select');
            if (select && select.value !== lang) {
                select.value = lang;
            }
        }

        var selectEl = document.getElementById('lang-select');
        if (selectEl) {
            selectEl.addEventListener('change', function() {
                setLanguage(this.value);
            });
        }

        // Первинна ініціалізація мови за замовчуванням (EN)
        setLanguage('en');

        // Ripple Effect Helper
        function createRipple(e, btn) {
            var ripple = document.createElement('span');
            ripple.classList.add('ripple');
            var rect = btn.getBoundingClientRect();
            var size = Math.max(rect.width, rect.height);
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
            ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
            btn.appendChild(ripple);
            setTimeout(function() { ripple.remove(); }, 600);
        }

        function escapeVCard(str) {
            return str.replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/<br>/g, ' - ');
        }

        // vCard Generator з підтримкою даних із CONFIG
        document.getElementById('save-contact').addEventListener('click', function(e) {
            var btn = this;
            createRipple(e, btn);

            var currentLang = document.documentElement.lang || 'en';
            var currentTitle = CONFIG.languages[currentLang].role;

            var vcard =
                "BEGIN:VCARD\n" +
                "VERSION:3.0\n" +
                "N;CHARSET=UTF-8:" + escapeVCard(CONFIG.lastName) + ";" + escapeVCard(CONFIG.firstName) + ";;;\n" +
                "FN;CHARSET=UTF-8:" + escapeVCard(CONFIG.firstName + " " + CONFIG.lastName) + "\n" +
                "ORG;CHARSET=UTF-8:" + escapeVCard(CONFIG.company) + "\n" +
                "TITLE;CHARSET=UTF-8:" + escapeVCard(currentTitle) + "\n" +
                "TEL;TYPE=CELL,VOICE:" + CONFIG.phoneRaw + "\n" +
                "EMAIL;TYPE=WORK,INTERNET:" + eStr + "\n" +
                "URL:" + CONFIG.websiteUrl + "\n" +
                "END:VCARD";

            var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

            if (isIOS) {
                window.location.href = "data:text/vcard;charset=utf-8," + encodeURIComponent(vcard);
            } else {
                var blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
                var url = window.URL.createObjectURL(blob);
                var link = document.createElement('a');
                link.download = CONFIG.firstName + "_" + CONFIG.lastName + ".vcf";
                link.href = url;
                link.click();
                window.URL.revokeObjectURL(url);
            }

            btn.classList.add('saved');
            setTimeout(function() { btn.classList.remove('saved'); }, 3000);
        });

        // Web Share API Implementation
        document.getElementById('share-btn').addEventListener('click', function(e) {
            var btn = this;
            createRipple(e, btn);
            
            var url = window.location.href;
            var shareData = {
                title: CONFIG.firstName + " " + CONFIG.lastName + " - " + CONFIG.company,
                text: CONFIG.languages.en.role.replace('<br>', ' at '),
                url: url
            };

            if (navigator.share) {
                navigator.share(shareData).catch(function(err) {
                    console.error('Error sharing:', err);
                });
            } else {
                navigator.clipboard.writeText(url).then(function() {
                    btn.classList.add('copied');
                    setTimeout(function() { btn.classList.remove('copied'); }, 3000);
                }).catch(function(err) {
                    console.error('Clipboard copy failed:', err);
                });
            }
        });
    </script>
</body>
</html>
